<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Browser Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
        .recording-active { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <header class="p-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]"></div>
            <h1 class="text-lg font-bold tracking-tight uppercase">AI Browser Agent</h1>
        </div>
        <i data-lucide="terminal" class="text-slate-500"></i>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 custom-scrollbar">
        <div class="flex justify-start">
            <div class="flex gap-3 max-w-[80%]">
                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center shrink-0">
                    <i data-lucide="bot" size="16"></i>
                </div>
                <div class="p-3 rounded-2xl text-sm bg-slate-900 border border-slate-800 rounded-tl-none">
                    Hello Gowtham! I'm ready to help. Try saying "Open Google" or "Search for Python tutorials".
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-slate-900/80 border-t border-slate-800">
        <div class="max-w-4xl mx-auto flex gap-3 items-center">
            
            <button id="mic-btn" class="p-4 bg-slate-800 hover:bg-slate-700 rounded-full transition-all active:scale-95 text-white">
                <i id="mic-icon" data-lucide="mic"></i>
            </button>
            
            <div class="flex-1 relative">
                <input type="text" id="user-input" 
                    placeholder="Type a command or hold the mic..." 
                    class="w-full bg-slate-800 border-none rounded-full px-6 py-4 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <button id="send-btn" class="p-4 bg-blue-600 hover:bg-blue-500 rounded-full transition-all active:scale-95">
                <i data-lucide="send"></i>
            </button>
        </div>
        <div class="text-center text-[10px] text-slate-600 mt-3 font-medium tracking-widest uppercase">
            WebSocket Status: <span id="ws-status" class="text-amber-500">Connecting...</span>
        </div>
    </footer>

    <script>
        // Initialize Icons
        lucide.createIcons();

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const wsStatus = document.getElementById('ws-status');

        // WebSocket Setup
        const socket = new WebSocket('ws://localhost:8000/chat');

        socket.onopen = () => {
            wsStatus.innerText = "Connected";
            wsStatus.className = "text-green-500";
        };

        socket.onclose = () => {
            wsStatus.innerText = "Disconnected";
            wsStatus.className = "text-red-500";
        };

        socket.onmessage = (event) => {
            appendMessage(event.data, 'assistant');
        };

        // UI Functions
        function appendMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const isSystem = text.includes("Action result");
            const bgColor = sender === 'user' ? 'bg-blue-700 text-white rounded-tr-none' : 
                          isSystem ? 'bg-slate-900 border border-amber-500/30 italic text-amber-200' : 
                          'bg-slate-900 border border-slate-800 rounded-tl-none';

            wrapper.innerHTML = `
                <div class="flex gap-3 max-w-[80%] ${sender === 'user' ? 'flex-row-reverse' : ''}">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 bg-slate-800">
                        <i data-lucide="${sender === 'user' ? 'user' : 'bot'}" size="16"></i>
                    </div>
                    <div class="p-3 rounded-2xl text-sm leading-relaxed shadow-lg ${bgColor}">
                        ${text.replace('Assistant: ', '')}
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            lucide.createIcons();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Send Text
        function handleSend() {
            const text = userInput.value.trim();
            if (text && socket.readyState === WebSocket.OPEN) {
                socket.send(text);
                appendMessage(text, 'user');
                userInput.value = '';
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => e.key === 'Enter' && handleSend());

        // Audio Recording Logic
        let mediaRecorder;
        let audioChunks = [];

        micBtn.addEventListener('mousedown', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(audioBlob);
                        appendMessage("🎤 Processing voice...", 'user');
                    }
                };

                mediaRecorder.start();
                micBtn.classList.add('recording-active');
                micIcon.setAttribute('data-lucide', 'square');
                lucide.createIcons();
            } catch (err) {
                alert("Mic access denied");
            }
        });

        window.addEventListener('mouseup', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                micBtn.classList.remove('recording-active');
                micIcon.setAttribute('data-lucide', 'mic');
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
